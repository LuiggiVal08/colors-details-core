services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        # ports:
        #   - '3000:3000' # Comentado para que el tráfico externo pase obligatoriamente por Nginx
        expose:
            - '3000' # Abre el puerto 3000 internamente para que Nginx pueda verlo
        env_file: .env
        environment:
            - PORT=3000 # Inyecta explícitamente el puerto en las variables de entorno de Node
        volumes:
            - .:/app # Sincroniza tu código local con el contenedor
            - /app/node_modules # Protege los paquetes de Docker de ser pisados por los de Windows
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
            interval: 5s
            timeout: 3s
            retries: 12
            # sequelize.sync({ alter: true }) tarda ~13s en levantar: este margen
            # evita que los 503 iniciales cuenten como fallos del healthcheck.
            start_period: 60s

    db:
        image: mysql:8.4
        # ports:
        #     - '3306:3306' # Descomenta para conectar DBeaver/TablePlus desde el host
        expose:
            - '3306' # Solo accesible desde la red interna de Docker
        environment:
            MYSQL_DATABASE: colorsanddetails
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        command:
            # Habilita mysql_native_password: necesario para que los clientes CLI
            # (mysql/mysqldump) funcionen sobre los binarios de Alpine (MariaDB).
            - '--mysql-native-password=ON'
        volumes:
            - db_data:/var/lib/mysql
            - ./db-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 5s
            retries: 5
            interval: 5s

    redis:
        image: redis:7-alpine
        # ports:
        #     - '6379:6379' # Descomenta para conectar RedisInsight/redis-cli desde el host
        expose:
            - '6379' # Solo accesible desde la red interna de Docker

    nginx:
        image: nginx:alpine
        container_name: colors_nginx
        ports:
            - '80:80' # Mapea el puerto 80 estándar de Windows al puerto 80 de Nginx
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Monta tu archivo de configuración en modo lectura
        depends_on:
            app:
                condition: service_healthy # Nginx espera a que la app esté lista, no solo arrancada

volumes:
    db_data:
