services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        # ports:
        #   - '3000:3000' # Comentado para que el tráfico externo pase obligatoriamente por Nginx
        expose:
            - '3000' # Abre el puerto 3000 internamente para que Nginx pueda verlo
        env_file: .env
        environment:
            - PORT=3000 # Inyecta explícitamente el puerto en las variables de entorno de Node
        volumes:
            - .:/app # Sincroniza tu código local con el contenedor
            - /app/node_modules # Protege los paquetes de Docker de ser pisados por los de Windows
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    db:
        image: mysql:8.4
        ports:
            - '3306:3306' # Mantiene el puerto de la base de datos accesible desde Windows por si usas DBeaver/TablePlus
        environment:
            MYSQL_DATABASE: colorsanddetails
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 5s
            retries: 5
            interval: 5s

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'

    nginx:
        image: nginx:alpine
        container_name: colors_nginx
        ports:
            - '80:80' # Mapea el puerto 80 estándar de Windows al puerto 80 de Nginx
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Monta tu archivo de configuración en modo lectura
        depends_on:
            - app # No levanta Nginx hasta que el contenedor de Node esté listo

volumes:
    db_data:
